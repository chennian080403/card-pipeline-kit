<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>审核与素材库</title>
<style>
:root {
  --bg: #eef1f5; --panel: #ffffff; --panel-2: #f3f5f8; --line: #dfe3ea;
  --text: #20232a; --muted: #687180; --accent: #6b4fd8; --accent-soft: #ece7fb;
  --ok: #2f7a4b; --ok-soft: #e1f0e6; --warn: #9a6a12; --warn-soft: #f5ecd6;
  --bad: #a3322a; --bad-soft: #f6dfdc; --shadow: 0 5px 20px rgba(30,41,59,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161a; --panel: #1c1f24; --panel-2: #23272e; --line: #31353d;
    --text: #e8eaee; --muted: #9aa1ad; --accent: #a08cf0; --accent-soft: #2c2645;
    --ok: #6cc48d; --ok-soft: #1f3327; --warn: #e0b45a; --warn-soft: #362d19;
    --bad: #ec7d72; --bad-soft: #3b2220; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #14161a; --panel: #1c1f24; --panel-2: #23272e; --line: #31353d;
  --text: #e8eaee; --muted: #9aa1ad; --accent: #a08cf0; --accent-soft: #2c2645;
  --ok: #6cc48d; --ok-soft: #1f3327; --warn: #e0b45a; --warn-soft: #362d19;
  --bad: #ec7d72; --bad-soft: #3b2220; --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.55 system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif; }
header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 20px; background: var(--panel);
  border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 19px; margin: 0; }
header small { color: var(--muted); }
header .spacer { flex: 1; }
button { font: inherit; }
.b { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: 6px 12px;
  font-size: 13px; cursor: pointer; }
.b:hover { border-color: var(--muted); }
.b.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.b.ok.on { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
.b.warn.on { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
.b.bad.on { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
.b[data-want].on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); font-weight: 600; }
.b[data-want].flash { animation: want-flash .35s ease-out; }   /* 按 S 切到的那个闪一下 */
@keyframes want-flash { from { background: var(--accent); color: #fff; transform: scale(1.08); } }
.layout { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: calc(100vh - 62px); }
aside { border-right: 1px solid var(--line); padding: 14px 10px; background: var(--panel); position: sticky; top: 62px;
  height: calc(100vh - 62px); overflow-y: auto; }
.nav-group { margin: 0 0 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.nav-group:last-child { border: 0; }
.nav-head { display: flex; justify-content: space-between; width: 100%; border: 0; background: none; color: var(--text);
  font-weight: 600; padding: 7px 10px; border-radius: 8px; cursor: pointer; text-align: left; }
.nav-head .tip { font-weight: 400; color: var(--muted); font-size: 12px; }
.nav-sub { display: flex; justify-content: space-between; gap: 8px; width: 100%; border: 0; background: none; color: var(--muted);
  padding: 6px 10px 6px 22px; border-radius: 8px; cursor: pointer; text-align: left; font-size: 13px; }
.nav-sub.deep { padding-left: 36px; font-size: 12.5px; }
.nav-head:hover, .nav-sub:hover { background: var(--panel-2); }
.nav-head.active, .nav-sub.active { background: var(--accent-soft); color: var(--accent); }
.count { font-size: 11px; color: var(--muted); background: var(--panel-2); border-radius: 999px; padding: 0 7px; align-self: center; }
.active .count { background: var(--panel); color: var(--accent); }
main { padding: 18px 22px 40px; min-width: 0; }
.summary { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
.summary h2 { font-size: 18px; margin: 0; }
.hint { color: var(--muted); font-size: 12.5px; margin: 0 0 14px; max-width: 900px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.chip { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 999px; padding: 3px 11px; font-size: 12px; cursor: pointer; }
.chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.list .item.kb { box-shadow: 0 0 0 2px var(--accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column;
  cursor: pointer; box-shadow: var(--shadow); transition: transform .08s; }
.card:hover { transform: translateY(-1px); border-color: var(--muted); }
.card[data-v="pass"] { border-color: #88b79b; } .card[data-v="fail"] { border-color: #daa399; }
.card[data-v="fail"] .media { opacity: .65; }
.card.kb, .folder.kb { box-shadow: 0 0 0 3px var(--accent); }
.nav-head.kb, .nav-sub.kb { box-shadow: inset 0 0 0 2px var(--accent); }
.media { aspect-ratio: 1; background: var(--panel-2); display: flex; align-items: center; justify-content: center; }
.media.alpha { background: repeating-conic-gradient(var(--panel-2) 0 25%, var(--panel) 0 50%) 0 0/14px 14px; }
.media img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
.card-info { padding: 9px 11px 11px; display: flex; flex-direction: column; gap: 4px; }
.card-info .t { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-info .m { font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
.badge { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
.badge.ok { background: var(--ok-soft); color: var(--ok); } .badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); } .badge.acc { background: var(--accent-soft); color: var(--accent); }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.empty { color: var(--muted); padding: 40px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }
.list { display: flex; flex-direction: column; gap: 8px; max-width: 900px; }
.list .item { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.list .item pre { margin: 6px 0 0; }
pre { white-space: pre-wrap; background: var(--panel-2); padding: 10px; border-radius: 8px; font-size: 12px; max-height: 240px; overflow: auto; margin: 0; }
input, select, textarea { font: inherit; font-size: 13px; color: var(--text); background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 9px; min-width: 0; }
textarea { width: 100%; min-height: 56px; resize: vertical; }
/* 备注 / 真源描述：平时收成一行，进框（A）按字数撑开，Esc / 回车 收起 */
textarea.grow { min-height: 0; resize: none; overflow: hidden; box-sizing: border-box; display: block; }
textarea.grow:focus { overflow-y: auto; }
dialog { border: 0; padding: 0; border-radius: 14px; width: min(1180px, 96vw); max-height: 94vh; background: var(--panel); color: var(--text); }
dialog::backdrop { background: rgba(10,12,18,.6); }
.dialog-top { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.dialog-top strong { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dialog-layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; max-height: calc(94vh - 56px); }
.viewer { background: #0f1115; display: flex; align-items: center; justify-content: center; min-height: 420px; padding: 10px; }
.viewer img { max-width: 100%; max-height: calc(94vh - 80px); object-fit: contain; cursor: zoom-in; }
.details { padding: 14px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.details h4 { margin: 0; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
.details .m { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.box { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
#d-srcbox.kb { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.hist { display: flex; gap: 6px; flex-wrap: wrap; }
.hist img { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); cursor: pointer; }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 14px;
  border-radius: 8px; font-size: 12.5px; max-width: min(640px, 92vw); white-space: pre-wrap; display: none; z-index: 99; }
#toast.bad { background: var(--bad); color: #fff; }
.nav-sub.empty-pack { opacity: .45; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 18px; font-weight: 600; }
.crumbs button { border: 0; background: none; color: var(--accent); font: inherit; padding: 0 2px; cursor: pointer; }
.crumbs button:hover { text-decoration: underline; }
.crumbs .sep { color: var(--muted); font-weight: 400; }
.section-title { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; margin: 4px 0 10px; }
.folders { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 22px; }
.folder { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; text-align: left;
  padding: 0; color: var(--text); display: flex; flex-direction: column; box-shadow: var(--shadow); }
.folder:hover { border-color: var(--muted); }
.folder.is-empty { opacity: .5; }
.folder .covers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; height: 86px; overflow: hidden; background: var(--panel-2); }
.folder .covers img { width: 100%; height: 100%; object-fit: cover; display: block; }
.folder .covers .none { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; }
.folder .f-info { padding: 8px 11px 10px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.folder .f-name { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.folder .f-meta { font-size: 11px; color: var(--muted); white-space: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); color: var(--muted); padding: 7px 16px; font: inherit; font-size: 13.5px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent); color: #fff; font-weight: 600; }
.line-tip { font-size: 12px; color: var(--muted); max-width: 520px; }
#menu-toggle { display: none; }
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  aside { position: static; height: auto; display: none; border-right: 0; border-bottom: 1px solid var(--line); }
  aside.open { display: block; }
  #menu-toggle { display: inline-block; }
  .dialog-layout { grid-template-columns: 1fr; }
  .viewer { min-height: 260px; }
  main { padding: 14px 16px 40px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
}
/* 看大图浮层：盖在当前页面上，点图片以外的任何地方退出 */
dialog.lb { border: 0; padding: 0; margin: 0; max-width: none; max-height: none; width: 100vw; height: 100vh; background: transparent;
  display: none; align-items: center; justify-content: center; cursor: zoom-out; }
dialog.lb[open] { display: flex; }
dialog.lb::backdrop { background: rgba(0, 0, 0, .78); }
dialog.lb img { max-width: 94vw; max-height: 90vh; object-fit: contain; border-radius: 6px; box-shadow: 0 12px 48px rgba(0, 0, 0, .5); cursor: default; }
dialog.lb #lb-cap { position: fixed; left: 0; right: 0; bottom: 14px; text-align: center; color: #ddd; font-size: 13px; pointer-events: none; }
</style>
</head>
<body>
<header>
  <button class="b" id="menu-toggle">分类</button>
  <div><h1>审核与素材库</h1><small id="proj"></small></div>
  <div class="seg" id="line" title="W：短效 / 长效 来回切 · E：切到下一个区（⇧E 上一个）"><button data-line="short">短效 · 定调</button><button data-line="long">长效 · 复用</button></div>
  <span class="line-tip" id="line-tip"></span>
  <span class="spacer"></span>
  <button class="b" id="reload">刷新</button>
</header>
<div class="layout"><aside id="nav"></aside><main id="view"></main></div>
<dialog id="lb" class="lb"><img id="lb-img" alt=""><div id="lb-cap"></div></dialog>
<dialog id="detail">
  <div class="dialog-top"><strong id="d-title"></strong>
    <button class="b" id="d-prev">← 上一项</button><button class="b" id="d-next">下一项 →</button><button class="b" id="d-close">关闭</button>
    <span class="m" style="font-size:12px" id="d-keys">键盘：← → 切换 · 1 要 · 3 不要（记完跳下一张）· 空格 跳过 · 回车 大图 · Esc / ⌫ 退出</span></div>
  <div class="dialog-layout"><div class="viewer"><img id="d-img" alt=""></div><div class="details" id="d-body"></div></div>
</dialog>
<div id="toast"></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isUrl = p => /^https?:/.test(p || "");
const img = p => !p ? "" : isUrl(p) ? p : `/file?path=${encodeURIComponent(p)}`;
const VERD = {pass: ["通过", "ok"], borderline: ["待定", "warn"], fail: ["不通过", "bad"]};
const LIB = {draft: ["草稿", ""], pending: ["待定", "warn"], final: ["定稿", "ok"], rejected: ["放弃", "bad"]};
// 短效 / 长效是同一个库的两个入口，两边用同一棵资产包树（大包/小包/子包）；文件不搬，只是归类。
const LINES = {
  short: {label: "短效 · 定调", tip: "找参考 → 试样 → 喜欢哪张就「定为真源」，送进长效。"},
  long: {label: "长效 · 复用", tip: "拿定下的真源反复出图，保持一致；出了问题回短效重新定调。"},
};
const ZONES = {
  reference: {line: "short", label: "参考区", tree: true, tip: "找来的参考 / 灵感素材（干净版）。试样时用 --ref 编号。"},
  trial: {line: "short", label: "试样区", tree: true, tip: "短效草图试出来的样子（剑长什么样、画风选哪种）。喜欢哪张就点开「定为真源」；不要的进废稿区。"},
  // 长效顺序：出图 → 素材 → 真源 → 废稿。提示词模板和沉淀记录并进真源区（真源只分「图」和「字」）
  review: {line: "long", label: "出图区 · 审成品", tree: true, tip: "镜头卡出的图。每张只问一件事：要（进素材区）还是不要（进废稿区）；拿不准就先不点。喜欢它的长相 / 画风 / 氛围 / 构图，点开「定为真源」。"},
  assets: {line: "long", label: "素材区", tree: true, tip: "点了「要」的图，最后用进片子里的成品。进来是草稿，你点「定稿」才算定稿。素材不是真源。定稿就是定下关键帧（关键的参考图）：视频要求只认定稿时，视频卡的关键帧只能用定稿图；正被视频卡用着的标「关键帧」。点开：1 定稿 · 2 移回原处（回出图区 / 试样区，变回未审）· 3 丢弃进废稿区。"},
  sources: {line: "long", label: "真源区", tree: true, tip: "以后出图要照着来的东西，只分两种：「图」（长相、画风、氛围的样张，画风 / 氛围还带一段描述）和「字」（构图模板）。一个名字只认一张，换了引用它的卡都跟着变，旧的进历史；「记录」里是每次定真源的账。点开：2 移回素材区（撤掉这次定真源，有旧版就换回旧版；原图回素材区，草图回试样区）· 3 撤掉真源、原图进废稿区。"},
  // 废稿只放一处：试样和出图标了不通过的都在这里，图上标「草图 / 成品」
  rejects: {line: "long", label: "废稿区", tree: true, tip: "点了「不要」的图都在这里，按原来的包放，图上标着「草图」或「成品」。点开：1 要（进素材区）· 2 移回原位（回出图区 / 试样区，变回未审）。"},
};
const firstZone = line => Object.keys(ZONES).find(g => ZONES[g].line === line);
let srcTab = "图";   // 真源区的页签：图 / 字 / 记录
let S = null, nav = {group: "review", path: ""}, filter = "all", flat = false, list = [], cur = -1, openFirst = null;
try { const u = new URL(location.href);
  if (u.searchParams.get("group")) nav.group = {library: "assets", trial_rejects: "rejects"}[u.searchParams.get("group")] || u.searchParams.get("group");
  if (u.searchParams.get("line") && !u.searchParams.get("group")) nav.group = firstZone(u.searchParams.get("line")) || nav.group;
  if (u.searchParams.get("group") === "log") srcTab = "记录";
  if (u.searchParams.get("group") === "prompts") srcTab = "字";
  if (!ZONES[nav.group]) nav.group = {log: "sources", prompts: "sources"}[nav.group] || "review";
  nav.path = u.searchParams.get("path") || ""; openFirst = u.searchParams.get("open"); } catch (e) {}

let reopenKey = "";   // load() 换 list 之前正看着的那张：等数据期间人可能已经翻过页，刷新后要回到这张，而不是发请求时那张
async function load() {
  S = await (await fetch("/api/state")).json();
  reopenKey = keyOf(list[cur]);
  $("proj").textContent = `${S.project} · 大包 → 小包 → 子包 · 短效长效同一棵树`;
  render();
  if (openFirst !== null) { openAt(+openFirst || 0); openFirst = null; }
}
// 同一张图的身份（筛选「未审」时，审完的图会离开列表，靠它找回位置）
const keyOf = it => it ? `${it.type}|${it.card ? it.card.id : ""}|${it.x ? it.x.name : it.file}` : "";
// done：成功时改弹这句（写清哪张图去了哪个区，防看错）；失败照旧弹后端原话
async function post(url, body, done) {
  const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const j = await r.json(); if (j.ok && done) toast(done, false, 5000); else toast(j.output || (j.ok ? "完成" : "失败"), !j.ok);
  await load();   // 失败也刷新：撤掉页面上先亮起的按钮
  if ($("detail").open) redrawDetail();
  return j;
}
// 刷新后重画详情：回到正看着的那张；列表空了（审完最后一张）就关掉详情和从详情开的大图。
// 人正在详情里的框里打字时，保住焦点、光标和框里还没存的字（不然焦点丢了，后面打的字会漏成快捷键）
function redrawDetail() {
  if (!list.length) { if ($("lb").open && lbFromDetail) $("lb").close(); $("detail").close(); return; }
  const k = reopenKey, a = document.activeElement;
  const typingIn = a && a.id && ["TEXTAREA", "INPUT", "SELECT"].includes(a.tagName) && $("d-body").contains(a)
    ? {id: a.id, value: a.value, start: a.selectionStart, end: a.selectionEnd, session: noteSession} : null;
  const n = list.findIndex(i => keyOf(i) === k);
  openAt(n >= 0 ? n : Math.min(cur, list.length - 1), true);
  const box = typingIn && keyOf(list[cur]) === k && $(typingIn.id);   // 换成别的图了就不往它的框里填
  if (box) {
    box.value = typingIn.value; box.focus();
    try { box.setSelectionRange(typingIn.start, typingIn.end); } catch (e) {}   // select 之类没有光标
    if (typingIn.id === "d-note") noteSession = typingIn.session;   // 重新聚焦不算新的一次编辑
  }
  if ($("lb").open && lbFromDetail && list[cur]) lightbox([{file: list[cur].file, cap: list[cur].title}], 0);   // 大图跟着换到新的当前图
}
function toast(msg, bad, ms) { const t = $("toast"); t.textContent = msg; t.className = bad ? "bad" : ""; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", ms || (bad ? 7000 : 3200)); }
const picName = f => (f || "").split("/").pop().replace(/\.[^.]+$/, "");   // s-剑_sunburst_2：同包几张只差 _1 / _2，提示里带上

    else if (k === "ArrowRight" && navBtns()[navSel]?.classList.contains("active")) { if (!e.repeat && targets().length) { zone = "main"; markSel(true); } }
    else if (k === "Enter" || k === "ArrowRight") { const b = navBtns()[navSel]; if (b) go(b.dataset.g, b.dataset.p); }
    else if (k === "ArrowLeft") { if (!e.repeat) navParent(); }   // 按住不放不连退，防止从右边冲过来一路退到顶
    else return;
  } else if (!inLb && targets().length) {
    // 最左再 ← 直接去左栏
    const inList = targets()[sel]?.classList.contains("item");   // 一条条竖着排：只走 ↑↓，← 去左栏，→ 不动
    if (k === "ArrowLeft" && (sel === 0 || inList)) { if (!e.repeat) navToActive(); }
    else if (k === "ArrowRight" && (sel === targets().length - 1 || inList)) {}   // 最后一张：不动
    else if (k === "ArrowLeft" || k === "ArrowRight") { sel += k === "ArrowLeft" ? -1 : 1; markSel(true); }
    else if (k === "ArrowUp" || k === "ArrowDown") { sel = vertical(k === "ArrowUp" ? -1 : 1); markSel(true); }
    else if (k === "Enter") enterSel();
    else return;
  } else return;
  e.preventDefault(); e.stopImmediatePropagation();
}, true);
// W：短效 / 长效来回切；E：同一条线里的区挨个切（短效 参考 ↔ 试样，长效 出图 → 素材 → 真源 → 废稿），⇧E 倒着切
document.querySelectorAll("#line [data-line]").forEach(b => b.onclick = () => {
  if (ZONES[nav.group].line === b.dataset.line) return;
  const g = lineLast[b.dataset.line] || firstZone(b.dataset.line);
  switchTo(g, samePath(g));
});
function nextZone(d) {
  const gs = Object.keys(ZONES).filter(g => ZONES[g].line === ZONES[nav.group].line), g = gs[(gs.indexOf(nav.group) + d + gs.length) % gs.length];
  switchTo(g, samePath(g));
}
$("reload").onclick = load; $("menu-toggle").onclick = () => $("nav").classList.toggle("open");
load().catch(e => toast("读不到数据：" + e, true));
// 切回这个标签页时自动拉一次新数据（后台出完图不用手点刷新）；看大图时不打断
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { saveNote(); return; }   // 切走标签页：备注存一版进版本历史
  if (!$("detail").open) load().catch(() => {});
});
</script>
</body>
